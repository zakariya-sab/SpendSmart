<!-- Statistics Component — Financial data visualization -->
<div>
  <div class="mb-4">
    <h2 class="fw-bold mb-1">Statistics</h2>
    <p class="text-muted mb-0">Visualize your spending patterns and trends</p>
  </div>

  <div class="row g-4">

    <!-- Category Pie Chart -->
    <div class="col-md-5">
      <div class="card h-100">
        <div class="card-header fw-semibold">
          <i class="bi bi-pie-chart me-2" style="color: #F97316;"></i>
          Spending by Category — {{ currentMonth }}
        </div>
        <div class="card-body d-flex align-items-center justify-content-center">
          <canvas #categoryChart style="max-height: 300px;"></canvas>
        </div>
      </div>
    </div>

    <!-- Monthly Spending Bar Chart -->
    <div class="col-md-7">
      <div class="card h-100">
        <div class="card-header fw-semibold">
          <i class="bi bi-bar-chart me-2" style="color: #F97316;"></i>
          Monthly Spending — Last 6 Months
        </div>
        <div class="card-body">
          <canvas #monthlyChart></canvas>
        </div>
      </div>
    </div>

    <!-- Score Evolution Line Chart -->
    <div class="col-12">
      <div class="card">
        <div class="card-header fw-semibold">
          <i class="bi bi-graph-up me-2" style="color: #F97316;"></i>
          Financial Health Score Evolution
        </div>
        <div class="card-body">
          <canvas #scoreChart style="max-height: 250px;"></canvas>
        </div>
      </div>
    </div>

  </div>
</div>
