<!-- Alerts Component — Budget notification center -->
<div>
  <!-- Page Header -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h2 class="fw-bold mb-1">
        Alerts
        <span *ngIf="unreadCount > 0" class="badge bg-danger ms-2">{{ unreadCount }}</span>
      </h2>
      <p class="text-muted mb-0">Budget threshold notifications</p>
    </div>
    <button *ngIf="unreadCount > 0" class="btn btn-outline-secondary" (click)="markAllAsRead()">
      <i class="bi bi-check2-all me-1"></i> Mark All as Read
    </button>
  </div>

  <!-- Feedback Message -->
  <div *ngIf="message" class="alert alert-success">{{ message }}</div>

  <!-- Loading -->
  <div *ngIf="isLoading" class="text-center py-5">
    <div class="spinner-border" style="color: #F97316;"></div>
  </div>

  <!-- Empty State -->
  <div *ngIf="!isLoading && alerts.length === 0" class="text-center py-5 text-muted">
    <i class="bi bi-bell-slash fs-1 d-block mb-2"></i>
    <p>No alerts yet. Keep up the good spending!</p>
  </div>

  <!-- Alerts List -->
  <div class="d-flex flex-column gap-3" *ngIf="!isLoading && alerts.length > 0">
    <div *ngFor="let alert of alerts"
         class="card border-0 shadow-sm"
         [style.border-left]="alert.isRead ? '' : '4px solid #F97316'"
         [class.opacity-75]="alert.isRead">

      <div class="card-body d-flex align-items-start gap-3">
        <!-- Alert Type Icon -->
        <div class="flex-shrink-0 mt-1">
          <span *ngIf="alert.type === 'EXCEEDED'"
                class="badge bg-danger fs-6 p-2">
            <i class="bi bi-exclamation-triangle-fill"></i>
          </span>
          <span *ngIf="alert.type === 'WARNING'"
                class="badge bg-warning text-dark fs-6 p-2">
            <i class="bi bi-exclamation-circle-fill"></i>
          </span>
        </div>

        <!-- Alert Content -->
        <div class="flex-grow-1">
          <div class="d-flex justify-content-between align-items-start">
            <p class="mb-1 fw-semibold" [class.text-muted]="alert.isRead">{{ alert.message }}</p>
            <!-- Type Badge -->
            <span class="badge ms-2"
                  [class.bg-danger]="alert.type === 'EXCEEDED'"
                  [class.bg-warning]="alert.type === 'WARNING'"
                  [class.text-dark]="alert.type === 'WARNING'">
              {{ alert.type }}
            </span>
          </div>
          <div class="text-muted small">
            <i class="bi bi-calendar3 me-1"></i>{{ alert.date | date:'dd/MM/yyyy HH:mm' }}
            <span *ngIf="alert.categoryName" class="ms-2">
              <i class="bi bi-tag me-1"></i>{{ alert.categoryName }}
            </span>
            <span *ngIf="alert.budgetMonth" class="ms-2">
              <i class="bi bi-clock me-1"></i>{{ alert.budgetMonth }}
            </span>
          </div>
        </div>

        <!-- Mark as Read Button (shown only for unread alerts) -->
        <button *ngIf="!alert.isRead"
                class="btn btn-sm btn-outline-secondary flex-shrink-0"
                (click)="markAsRead(alert.id)">
          <i class="bi bi-check-lg"></i>
        </button>
        <!-- Read checkmark -->
        <span *ngIf="alert.isRead" class="text-success flex-shrink-0 fs-5">
          <i class="bi bi-check-circle-fill"></i>
        </span>
      </div>
    </div>
  </div>
</div>
