// SpendSmart Android App — Module-level build configuration
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.spendsmart'
    // Compile against Android SDK 34 (Android 14)
    compileSdk 34

    defaultConfig {
        applicationId "com.spendsmart"
        // Minimum API 24 = Android 7.0 Nougat
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // Enable ViewBinding for type-safe view access in activities and fragments
    buildFeatures {
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    // AndroidX Core and AppCompat for modern Android APIs
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'

    // Material Design components (BottomNavigationView, Buttons, Cards, etc.)
    implementation 'com.google.android.material:material:1.11.0'

    // RecyclerView for scrollable lists of expenses, budgets, alerts
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // ConstraintLayout for flexible and responsive layouts
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Retrofit2 — HTTP client for calling the Spring Boot REST API
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'

    // Gson converter — parses JSON API responses into Kotlin data classes
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'

    // OkHttp logging interceptor — logs HTTP requests/responses for debugging
    implementation 'com.squareup.okhttp3:logging-interceptor:4.9.0'

    // Fragment support for bottom navigation tabs
    implementation 'androidx.fragment:fragment-ktx:1.6.2'

    // Testing dependencies
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
