# =============================================
# SpendSmart Application Configuration
# =============================================

# ----- Server Configuration -----
# Application runs on port 8080
server.port=8080

# ----- MySQL Database Configuration -----
# Connection URL to the spendsmart_db MySQL database
spring.datasource.url=jdbc:mysql://localhost:3306/spendsmart_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
# Database username (change to your MySQL username)
spring.datasource.username=root
# Database password (change to your MySQL password)
spring.datasource.password=
# MySQL JDBC driver class
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ----- JPA / Hibernate Configuration -----
# Auto update schema on startup (creates or alters tables to match entities)
spring.jpa.hibernate.ddl-auto=update
# Log all SQL statements to console for debugging
spring.jpa.show-sql=true
# Format SQL output for better readability
spring.jpa.properties.hibernate.format_sql=true
# MySQL dialect for Hibernate query generation
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ----- JWT Security Configuration -----
# Secret key used to sign and verify JWT tokens (change in production!)
application.security.jwt.secret-key=6D5A7134743777217A25432A46294A404E635266556A586E3272357538782F41
# JWT token expiration: 24 hours in milliseconds
application.security.jwt.expiration=86400000

# ----- ML Flask API Configuration -----
# URL of the Python Flask prediction service
ml.api.url=http://localhost:5000/predict

# ----- Logging Configuration -----
# Log security-related events for debugging
logging.level.org.springframework.security=DEBUG
